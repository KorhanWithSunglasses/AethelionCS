name: Build and Publish Plugins

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Unit & Regression Tests
        run: ./gradlew test --info

      - name: Build Plugins & Generate plugins.json
        run: ./gradlew make makePluginsJson --info

      - name: Copy Plugin Artifacts to Root Build Directory
        run: |
          mkdir -p build_deploy
          cp DiziboxProvider/build/DiziboxProvider.cs3 build_deploy/ || cp build/DiziboxProvider.cs3 build_deploy/ || true
          cp build/plugins.json build_deploy/ || true

      - name: Deploy Artifacts to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build_deploy
          clean: false
